# Sveltia CMS 配置（MIT 许可，v0.252.0，自托管于本目录）
# 登录方式：GitHub 细粒度个人访问令牌（登录界面选“使用访问令牌登录”），不需要 OAuth 中转或任何后端。
backend:
  name: github
  repo: QGMoe/The_Online_Manual_Guide_of_Youran_Minecraft_Server
  branch: master
  commit_messages:
    create: "docs: 新建页面 {{collection}}/{{slug}}"
    update: "docs: 修改页面 {{collection}}/{{slug}}"
    delete: "docs: 删除页面 {{collection}}/{{slug}}"
    uploadMedia: "docs: 上传图片 {{path}}"
    deleteMedia: "docs: 删除图片 {{path}}"

# 留空的可选字段不写进文件（各章页面的隐藏字段 title 平时为空，页面照旧没有 front matter）
output:
  omit_empty_optional_fields: true

site_url: https://docs.youran.qingu.moe/
display_url: https://docs.youran.qingu.moe/

# 图片统一放在 docs/assets/images/，与迁移进来的图片在一起
media_folder: docs/assets/images
public_folder: /assets/images

collections:
  # 首页与每页底部的页脚
  - name: home
    label: 首页与页脚
    label_singular: 页面
    files:
      - name: intro
        label: 简介（首页）
        file: docs/README.md
        media_folder: assets/images
        public_folder: assets/images
        fields:
          - { name: body, label: 正文, widget: markdown, modes: [raw] }
      - name: footer
        label: 页脚（显示在每页底部）
        file: docs/FOOTER.md
        media_folder: assets/images
        public_folder: assets/images
        fields:
          - { name: body, label: 正文, widget: markdown, modes: [raw] }

  # 各章：在对应章节下新建页面，不需要改目录——新页面会自动排在本章已有页面之后，标题取页面里的第一个一级标题（# 标题）
  - name: section1
    label: 第一章 入门
    label_singular: 页面
    folder: docs/section1
    extension: md
    create: true
    slug: "page-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{body | truncate(40)}}"
    preview_path: "section1/{{slug}}.html"
    media_folder: ../assets/images
    public_folder: ../assets/images
    fields:
      # 不在编辑界面里出现、也不写进文件（留空的可选字段不输出）；只为“目录顺序”里引用页面时能取到页面的第一个标题当显示名
      - { name: title, widget: hidden, required: false }
      - { name: body, label: 正文, widget: markdown, modes: [raw] }

  - name: section2
    label: 第二章 认识悠然
    label_singular: 页面
    folder: docs/section2
    extension: md
    create: true
    slug: "page-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{body | truncate(40)}}"
    preview_path: "section2/{{slug}}.html"
    media_folder: ../assets/images
    public_folder: ../assets/images
    fields:
      # 不在编辑界面里出现、也不写进文件（留空的可选字段不输出）；只为“目录顺序”里引用页面时能取到页面的第一个标题当显示名
      - { name: title, widget: hidden, required: false }
      - { name: body, label: 正文, widget: markdown, modes: [raw] }

  - name: section3
    label: 第三章 生存前期
    label_singular: 页面
    folder: docs/section3
    extension: md
    create: true
    slug: "page-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{body | truncate(40)}}"
    preview_path: "section3/{{slug}}.html"
    media_folder: ../assets/images
    public_folder: ../assets/images
    fields:
      # 不在编辑界面里出现、也不写进文件（留空的可选字段不输出）；只为“目录顺序”里引用页面时能取到页面的第一个标题当显示名
      - { name: title, widget: hidden, required: false }
      - { name: body, label: 正文, widget: markdown, modes: [raw] }

  # 各章的页面顺序与章节标题：就是各章目录下的 .nav.yml（mkdocs-awesome-nav 读它生成侧栏）
  - name: nav
    label: 目录顺序
    label_singular: 目录
    editor: { preview: false }
    files:
      - name: section1
        label: 第一章 的页面顺序
        file: docs/section1/.nav.yml
        fields:
          - { name: title, label: 章节标题（侧栏里显示的章名）, widget: string }
          - { name: append_unmatched, widget: hidden, default: true }
          - name: nav
            label: 页面顺序
            hint: 拖动左边的把手调整顺序；侧栏照这个顺序排。没列在这里的页面（比如刚新建的）自动排在本章最后。
            widget: list
            field:
              name: page
              label: 页面
              widget: relation
              collection: section1
              # 存成“文件名.md”（.nav.yml 的写法）；显示名：页面的 title 字段平时为空，为空时编辑工具自动用正文的第一个标题
              value_field: "{{slug}}.md"
              display_fields: ["{{title}}"]
              search_fields: ["body"]
      - name: section2
        label: 第二章 的页面顺序
        file: docs/section2/.nav.yml
        fields:
          - { name: title, label: 章节标题（侧栏里显示的章名）, widget: string }
          - { name: append_unmatched, widget: hidden, default: true }
          - name: nav
            label: 页面顺序
            hint: 拖动左边的把手调整顺序；侧栏照这个顺序排。没列在这里的页面（比如刚新建的）自动排在本章最后。
            widget: list
            field:
              name: page
              label: 页面
              widget: relation
              collection: section2
              # 存成“文件名.md”（.nav.yml 的写法）；显示名：页面的 title 字段平时为空，为空时编辑工具自动用正文的第一个标题
              value_field: "{{slug}}.md"
              display_fields: ["{{title}}"]
              search_fields: ["body"]
      - name: section3
        label: 第三章 的页面顺序
        file: docs/section3/.nav.yml
        fields:
          - { name: title, label: 章节标题（侧栏里显示的章名）, widget: string }
          - { name: append_unmatched, widget: hidden, default: true }
          - name: nav
            label: 页面顺序
            hint: 拖动左边的把手调整顺序；侧栏照这个顺序排。没列在这里的页面（比如刚新建的）自动排在本章最后。
            widget: list
            field:
              name: page
              label: 页面
              widget: relation
              collection: section3
              # 存成“文件名.md”（.nav.yml 的写法）；显示名：页面的 title 字段平时为空，为空时编辑工具自动用正文的第一个标题
              value_field: "{{slug}}.md"
              display_fields: ["{{title}}"]
              search_fields: ["body"]
